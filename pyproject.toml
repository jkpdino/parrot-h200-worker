[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parrot-xl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "tokenizers>=0.20"]

[tool.setuptools.packages.find]
include = ["parrot*"]

[tool.setuptools.package-data]
parrot = ["kernels/*.metal"]
