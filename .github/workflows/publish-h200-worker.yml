name: Publish H200 worker

on:
  workflow_dispatch:
  push:
    tags:
      - "h200-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod-h200/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jkpdino/parrot-h200:cu128-torch28-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
